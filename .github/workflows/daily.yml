# Daily at 05:10 Pacific: load everything collected into Snowflake, build and test with dbt,
# export the dashboard from Snowflake and publish it to GitHub Pages.
# Needs repository secrets SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PRIVATE_KEY (the .p8 file's contents),
# and Pages set to "GitHub Actions" under Settings -> Pages.
name: daily
on:
  schedule:
    - cron: "10 12 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: SYSADMIN
      SNOWFLAKE_WAREHOUSE: PORTFOLIO_WH
    steps:
      - name: Check the Snowflake secrets exist
        id: ready
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ]; then echo "::notice::Snowflake secrets not set yet; skipping the daily build."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.go == 'true'
        with: {python-version: "3.12", cache: pip}
      - if: steps.ready.outputs.go == 'true'
        run: pip install -r requirements.txt dbt-snowflake snowflake-connector-python opencv-python-headless
      - name: Write the Snowflake key
        if: steps.ready.outputs.go == 'true'
        run: |
          mkdir -p ~/.snowflake
          printf '%s\n' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$HOME/.snowflake/rsa_key.p8" >> "$GITHUB_ENV"
      - name: Sync collected data and land it
        if: steps.ready.outputs.go == 'true'
        run: |
          python ingest/sync_data.py
          python ingest/load_raw.py
          python ingest/load_snowflake.py --duckdb warehouse/cloverleaf.duckdb --database CLOVERLEAF --schemas raw_cloverleaf
      - name: dbt build on Snowflake
        if: steps.ready.outputs.go == 'true'
        run: dbt build --profiles-dir . --target snowflake
      - name: Keep the build results for monitoring (Cloverfield reads these)
        if: always() && steps.ready.outputs.go == 'true'
        run: |
          [ -f target/run_results.json ] || exit 0
          git config user.name "cloverleaf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add ../data origin/data && cd ../data && git switch -c data-tmp
          mkdir -p ops/dbt && cp ../${{ github.event.repository.name }}/target/run_results.json "ops/dbt/$(date -u +%Y%m%dT%H%M%S)_${{ github.run_id }}.json"
          git add ops && git commit -qm "dbt results $(date -u +%F)" && git push origin HEAD:data
      - name: Export the dashboard from Snowflake
        if: steps.ready.outputs.go == 'true'
        run: |
          python dashboard/export_data.py --target snowflake
          mkdir -p site && cp dashboard/index.html dashboard/data.json site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.ready.outputs.go == 'true' && vars.PAGES_ENABLED == 'true'
        with: {path: site}
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
