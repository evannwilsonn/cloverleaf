# Every 30 minutes: record a clip from each camera, count vehicles, pull recent weather,
# and append the results to the `data` branch. No secrets needed.
# GitHub may start scheduled runs late or skip one under load; the pipeline measures that
# as capture coverage rather than hiding it.
name: collect
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collect.txt
      - uses: actions/cache@v4
        with:
          path: "*.pt"
          key: yolo-weights-v8s
      - run: pip install -r requirements-collect.txt
      - name: Record and analyse clips
        run: python collector/capture.py --out out/captures
      - name: Pull weather observations
        run: python collector/fetch_weather.py --hours 3 --out out/weather || echo "weather pull failed; cameras still saved"
      - name: Append to the data branch
        run: |
          git config user.name "cloverleaf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data --depth=1 || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add ../data origin/data && (cd ../data && git switch -c data)
          else
            git worktree add --orphan -b data ../data
          fi
          mkdir -p ../data/captures ../data/weather
          cp -r out/captures/. ../data/captures/
          cp -r out/weather/. ../data/weather/ 2>/dev/null || true
          cd ../data
          git add captures weather
          git commit -qm "collect $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push origin data && break; git pull --rebase origin data; done
