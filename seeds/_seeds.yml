version: 2
seeds:
  - name: cameras
    description: The Caltrans District 4 cameras Cloverleaf records, their corridor and nearest NWS station.
    columns:
      - name: camera_id
        data_tests: [unique, not_null]
      - name: weather_station
        data_tests:
          - relationships: {arguments: {to: ref('weather_stations'), field: station_id}}
  - name: weather_stations
    columns:
      - name: station_id
        data_tests: [unique]
  - name: qc_rules
    columns:
      - name: rule_id
        data_tests: [unique]
  - name: kpi_catalog
    columns:
      - name: kpi_id
        data_tests: [unique]
  - name: eval_labels
    description: >
      Vehicles a person counted on each evaluation frame (vehicles on the roadway; parked cars off the freeway excluded).
      count_zone_top (0-1, blank = whole frame) limits the count to vehicles whose centre is below that share of the
      frame height, where busy far traffic cannot be counted reliably by hand; the detector is scored in the same zone.
    config:
      column_types: {frame_file: varchar, labelled_vehicles: integer, count_zone_top: double, note: varchar}
    columns:
      - name: frame_file
        data_tests: [unique]
